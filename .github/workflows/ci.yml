name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Portfolio + demo apps (build and unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  apis:
    name: ${{ matrix.app }} API (pytest against PostGIS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [geomind, landscope]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: projects/${{ matrix.app }}/api
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/${{ matrix.app }}/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m app.seed
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -rf --tb=short 2>&1 | tee pytest.log
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          # Annotations are visible on the run page without downloading logs.
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r line; do echo "::error title=${{ matrix.app }} test::${line}"; done
          grep -E "^E  " pytest.log | head -15 | while read -r line; do echo "::error title=${{ matrix.app }} assertion::${line}"; done
